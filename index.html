<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jrz Notes Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CSS VARIABLES (Design System)
           ========================================================================== */
        :root {
            /* Brand & Action Colors */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary: #475569;
            --secondary-hover: #334155;
            
            /* Status Colors */
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fef2f2;
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;

            /* Surface & Background */
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --border-color-focus: #93c5fd;

            /* Typography */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-inverse: #ffffff;
            
            /* Effects & Layout */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* Dark Mode Theme */
        .night-mode {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: #1e3a8a;
            
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #334155;
            --border-color: #334155;
            --border-color-focus: #3b82f6;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        }

        /* ==========================================================================
           2. RESET & BASE
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           3. LAYOUT & NAVIGATION
           ========================================================================== */
        .app-header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 72px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .header-utilities {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Clock Widget */
        .clock-widget {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: var(--bg-body);
            padding: 6px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .digital-clock {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--primary);
        }

        .clock-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid var(--border-color);
            padding-left: 16px;
        }

        .timezone-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        #timezoneSelect {
            appearance: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        #timezoneSelect:hover {
            color: var(--text-main);
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            border-radius: 24px;
            transition: var(--transition);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Main Container */
        .app-main {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 32px 24px;
            flex: 1;
        }

        /* Tabs Navigation */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
            font-family: inherit;
        }

        .tab:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-main);
        }

        .tab.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .night-mode .tab.active {
            background-color: var(--primary-light);
            color: var(--text-main);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           4. COMPONENTS (Cards, Forms, Buttons)
           ========================================================================== */
        /* Cards */
        .glass-container, .saved-note, .stat-card, .search-result {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 32px;
            transition: var(--transition);
        }

        .saved-note, .search-result {
            padding: 24px;
            margin-bottom: 16px;
        }

        .saved-note:hover, .search-result:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-color-focus);
        }

        /* Form Grid Layout */
        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .input-container.full-width {
            grid-column: span 2;
        }

        /* Form Controls */
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-container label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-container input,
        .input-container select,
        .input-container textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .input-container input:focus,
        .input-container select:focus,
        .input-container textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--focus-ring);
            background-color: var(--bg-surface);
        }

        .input-container textarea {
            resize: vertical;
            min-height: 100px;
        }

        .input-container input[readonly] {
            background-color: var(--bg-surface-hover);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        /* Buttons */
        .button-container {
            grid-column: span 2;
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        /* Button Variants */
        button[type="submit"], button[onclick="saveNoteOnly()"], button[onclick="copyNote()"], 
        button[onclick="copyOutboundData()"], button[onclick="copyT2()"] {
            background-color: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        button[type="submit"]:hover, button[onclick="saveNoteOnly()"]:hover, button[onclick="copyNote()"]:hover {
            background-color: var(--primary-hover);
        }

        button[onclick="resetForm()"], button[onclick="resetOutboundForm()"], button[onclick="resetT2Form()"],
        button[onclick="autoFillSample()"], button[onclick="autoFillOutboundSample()"], button[onclick="autoFillT2Sample()"],
        .edit-button, .copy-button {
            background-color: var(--bg-surface);
            border-color: var(--border-color);
            color: var(--text-main);
        }

        button[onclick="resetForm()"]:hover, .edit-button:hover, .copy-button:hover {
            background-color: var(--bg-surface-hover);
            border-color: var(--text-muted);
        }

        .delete-button {
            background-color: var(--bg-surface);
            border-color: var(--danger);
            color: var(--danger);
        }

        .delete-button:hover {
            background-color: var(--danger);
            color: white;
        }

        /* ==========================================================================
           5. DASHBOARD & DATA PRESENTATION
           ========================================================================== */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        .stat-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bulk-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        /* Note Data Styling */
        .saved-note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .note-meta-data {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .note-id {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .note-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .note-content-preview {
            background: var(--bg-body);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .note-content-preview strong {
            color: var(--text-main);
        }

        .saved-note-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* Search Section */
        .search-section {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .search-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--bg-surface);
            color: var(--text-main);
            margin-bottom: 24px;
            transition: var(--transition);
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--focus-ring);
        }

        /* ==========================================================================
           6. UTILITIES & OVERLAYS
           ========================================================================== */
        /* Message/Toast System */
        #messageContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .message {
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--bg-surface);
            border-left: 4px solid;
            pointer-events: auto;
        }

        .message.success { border-color: var(--success); color: var(--text-main); }
        .message.error { border-color: var(--danger); color: var(--text-main); }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--bg-surface);
            margin: 5% auto;
            padding: 32px;
            width: 100%;
            max-width: 800px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-content h2 {
            margin-bottom: 24px;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .close {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: var(--danger); }

        /* Typography Extras */
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; height: auto; padding: 16px; gap: 16px; }
            .header-utilities { width: 100%; justify-content: space-between; }
            form { grid-template-columns: 1fr; }
            .input-container.full-width { grid-column: span 1; }
            .button-container { grid-column: span 1; flex-direction: column; }
            .tabs-container { overflow-x: auto; white-space: nowrap; padding-bottom: 12px; }
        }
    </style>
</head>

                <div class="input-container full-width">

    <script>
        let currentTimezone = 'UTC';
        let messageTimeout;

        function sanitizeHTML(str) {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }

        function copyToClipboard(text, successMessage) {
            navigator.clipboard.writeText(text).then(() => {
                showMessage(successMessage);
            }).catch(err => {
                showMessage('Failed to copy to clipboard', 'error');
                console.error('Clipboard error:', err);
            });
        }

        function showMessage(text, type = 'success') {
            const container = document.getElementById('messageContainer');
            const existing = Array.from(container.children).find(
                el => el.textContent === text && el.classList.contains(type)
            );
            if (existing) {
                existing.remove();
            }
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.appendChild(message);
            setTimeout(() => { message.remove(); }, 2500);
        }

        function toggleNightMode() {
            document.body.classList.toggle("night-mode");
            const isNightMode = document.body.classList.contains("night-mode");
            localStorage.setItem('nightMode', isNightMode);
            showMessage(`${isNightMode ? 'Dark' : 'Light'} mode activated`);
        }

        if (localStorage.getItem('nightMode') === 'true') {
            document.body.classList.add('night-mode');
            document.getElementById('nightMode').checked = true;
        }

        function switchTab(tabId) {
            const tabs = document.querySelectorAll(".tab-content");
            tabs.forEach(tab => tab.classList.remove("active"));
            
            const selectedTab = document.getElementById(tabId);
            selectedTab.classList.add("active");

            const tabButtons = document.querySelectorAll(".tab");
            tabButtons.forEach(button => {
                button.classList.remove("active");
                button.setAttribute("aria-selected", "false");
            });
            
            const tabNames = {
                'notesTab': 'Inbound',
                'outboundTab': 'Outbound', 
                't2TemplateTab': 'T2 Template',
                'savedNotesTab': 'Saved Notes'
            };
            
            const activeButton = Array.from(tabButtons).find(button => 
                button.textContent.includes(tabNames[tabId])
            );
            if (activeButton) {
                activeButton.classList.add("active");
                activeButton.setAttribute("aria-selected", "true");
            }

            if (tabId === 'savedNotesTab') {
                displaySavedNotes();
                updateStats();
            }
        }

        function executeSaveNote() {
            const mcn = document.getElementById("mcn").value;
            if (!mcn.trim()) {
                showMessage('MCN or Case ID is required', 'error');
                return false;
            }
            const note = {
                mcn: mcn,
                transactionId: document.getElementById("transactionId").value,
                contactName: document.getElementById("contactName").value,
                email: document.getElementById("email").value,
                callBackNumber: document.getElementById("callBackNumber").value,
                passphraseVerification: document.getElementById("passphraseVerification").value,
                passphraseVerified: document.getElementById("passphraseVerified").value,
                pbx: document.getElementById("pbx").value,
                symptom: document.getElementById("symptom").value,
                issue: document.getElementById("issue").value,
                resolution: document.getElementById("resolution").value,
                troubleshootingSteps: document.getElementById("troubleshootingSteps").value,
                timestamp: new Date().toLocaleString(),
                dateCreated: new Date().toISOString()
            };
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const existingNoteIndex = savedNotes.findIndex(n => n.mcn === note.mcn);
            if (existingNoteIndex !== -1) {
                savedNotes[existingNoteIndex] = { ...savedNotes[existingNoteIndex], ...note };
            } else {
                savedNotes.push(note);
            }
            localStorage.setItem("notes", JSON.stringify(savedNotes));
            localStorage.removeItem('autoSave_notesForm');
            updateStats();
            return note;
        }

        function saveNoteOnly() {
            if (executeSaveNote()) {
                showMessage('Note saved successfully');
            }
        }

        function copyNote() {
            const note = executeSaveNote();
            if (!note) return;
            const noteText = `MCN or Case ID: ${note.mcn}\nTransaction ID: ${note.transactionId}\nContact Name: ${note.contactName}\nEmail Address: ${note.email}\nCall Back Number: ${note.callBackNumber}\nSecurity Passphrase Verification Needed: ${note.passphraseVerification}\nSecurity Passphrase Verified: ${note.passphraseVerified}\nPBX: ${note.pbx}\nSymptom: ${note.symptom}\nIssue: ${note.issue}\nResolution: ${note.resolution}\nTroubleshooting Steps: ${note.troubleshootingSteps}`;
            copyToClipboard(noteText, 'Note copied & saved successfully');
        }

        function copyOutboundData() {
            const contactName = document.getElementById("outboundContactName").value;
            const contactPhone = document.getElementById("outboundContactPhone").value;
            const email = document.getElementById("outboundEmail").value;
            const vccTransId = document.getElementById("vccTransId").value;
            const update = document.getElementById("outboundUpdate").value;
            if (!contactName.trim() || !contactPhone.trim()) {
                showMessage('Contact name and phone are required', 'error');
                return;
            }
            const outboundData = `Contact Name called: ${contactName}\nContact Phone Number Dialed: ${contactPhone}\nContact Email Address: ${email}\nVCC Trans ID: ${vccTransId}\nUpdate/Troubleshooting: ${update}`;
            localStorage.removeItem('autoSave_outboundForm');
            copyToClipboard(outboundData, 'Outbound data copied successfully');
        }

        function copyT2() {
            const parentAccount = document.getElementById("parentAccount").value;
            const pbxName = document.getElementById("pbxName").value;
            const contactName = document.getElementById("t2ContactName").value;
            const callBackNumber = document.getElementById("t2CallBackNumber").value;
            const email = document.getElementById("t2Email").value;
            const contactTimeZone = document.getElementById("contactTimeZone").value;
            const leadApproval = document.getElementById("leadApproval").value;
            const symptom = document.getElementById("t2Symptom").value;
            const issue = document.getElementById("t2Issue").value;
            const resolution = document.getElementById("t2Resolution").value;
            const canReplicate = document.getElementById("canReplicate").value;
            const troubleshootingSteps = document.getElementById("t2TroubleshootingSteps").value;
            const kbArticles = document.getElementById("kbArticles").value;
            const loginInfo = document.getElementById("loginInfo").value;

            if (!parentAccount.trim() || !contactName.trim()) {
                showMessage('Parent account and contact name are required', 'error');
                return;
            }

            const t2Text = `Parent Account: ${parentAccount}\nPBX Name: ${pbxName}\nContact Name: ${contactName}\nCall Back Number: ${callBackNumber}\nEmail Address: ${email}\nContact Time Zone: ${contactTimeZone}\nLead Approval: ${leadApproval}\nSymptom: ${symptom}\nIssue: ${issue}\nResolution: ${resolution}\nCan the agent replicate the issue?: ${canReplicate}\nTroubleshooting Steps: ${troubleshootingSteps}\nKnowledge Base article(s) consulted (URL): ${kbArticles}\nLogin Info (UID): ${loginInfo}`;
            localStorage.removeItem('autoSave_t2Form');
            copyToClipboard(t2Text, 'T2 Template copied successfully');
        }

        function displaySavedNotes() {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const savedNotesContainer = document.getElementById("savedNotes");
            
            if (savedNotes.length === 0) {
                savedNotesContainer.innerHTML = '<div class="saved-note" style="text-align:center; color:var(--text-muted);">No saved notes yet. Create your first record in the Inbound tab.</div>';
                return;
            }

            savedNotesContainer.innerHTML = savedNotes.map((note, index) => `
                <div class="saved-note">
                    <div class="saved-note-header">
                        <div class="note-meta-data">
                            <div class="note-id">
                                <input type="checkbox" class="note-checkbox" data-index="${index}" aria-label="Select note">
                                MCN: ${sanitizeHTML(note.mcn)}
                            </div>
                            <div class="note-subtitle">
                                ${sanitizeHTML(note.contactName)} | ${sanitizeHTML(note.email)} | ${sanitizeHTML(note.timestamp)}
                            </div>
                        </div>
                    </div>
                    <div class="note-content-preview">
                        <strong>Issue:</strong> ${sanitizeHTML(note.issue)}<br>
                        <strong>Resolution:</strong> ${sanitizeHTML(note.resolution)}
                    </div>
                    <div class="saved-note-actions">
                        <button onclick="editNote(${index})" class="edit-button">Edit</button>
                        <button onclick="copyNoteToClipboard(${index})" class="copy-button">Copy</button>
                        <button onclick="duplicateNote(${index})" class="copy-button">Duplicate</button>
                        <button onclick="deleteNote(${index})" class="delete-button">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        function searchNotes() {
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            if (!searchTerm.trim()) {
                document.getElementById("searchResults").innerHTML = '';
                return;
            }
            const searchResults = savedNotes.filter(note =>
                (note.mcn || "").toLowerCase().includes(searchTerm) ||
                (note.transactionId || "").toLowerCase().includes(searchTerm) ||
                (note.contactName || "").toLowerCase().includes(searchTerm) ||
                (note.email || "").toLowerCase().includes(searchTerm) ||
                (note.callBackNumber || "").toLowerCase().includes(searchTerm) ||
                (note.symptom || "").toLowerCase().includes(searchTerm) ||
                (note.issue || "").toLowerCase().includes(searchTerm) ||
                (note.resolution || "").toLowerCase().includes(searchTerm) ||
                (note.troubleshootingSteps || "").toLowerCase().includes(searchTerm)
            );

            const searchResultsContainer = document.getElementById("searchResults");
            searchResultsContainer.innerHTML = searchResults.length > 0
                ? `<div style="margin-bottom: 16px; font-weight: 500; color: var(--text-muted);">${searchResults.length} results found</div>` + searchResults.map((note, index) => `
                    <div class="search-result">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div class="note-meta-data">
                                <strong class="note-id">MCN: ${sanitizeHTML(note.mcn)}</strong>
                                <div class="note-subtitle">${sanitizeHTML(note.contactName)} | ${sanitizeHTML(note.timestamp)}</div>
                                <div style="margin-top: 8px;"><strong>Issue:</strong> ${sanitizeHTML(note.issue)}</div>
                            </div>
                            <button onclick="editNote(${savedNotes.findIndex(n => n.mcn === note.mcn)})" class="edit-button">Edit</button>
                        </div>
                    </div>
                `).join("")
                : "<div class='search-result'>No matching records found.</div>";
        }

        function updateClock() {
            const now = new Date();
            const options = { timeZone: currentTimezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById("digitalClock").textContent = now.toLocaleTimeString('en-US', options);
        }

        function updateTimezone() {
            currentTimezone = document.getElementById("timezoneSelect").value;
            const splitTz = currentTimezone.split('/');
            document.getElementById("timezoneLabel").textContent = splitTz[1] ? splitTz[1].replace('_', ' ') : currentTimezone;
            showMessage(`Timezone updated to ${document.getElementById("timezoneLabel").textContent}`);
        }

        function deleteNote(index) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            savedNotes.splice(index, 1);
            localStorage.setItem("notes", JSON.stringify(savedNotes));
            displaySavedNotes();
            updateStats();
            showMessage('Record deleted successfully');
        }

        function duplicateNote(index) {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const noteToDuplicate = { ...savedNotes[index] };
            noteToDuplicate.mcn = noteToDuplicate.mcn + '_COPY';
            noteToDuplicate.timestamp = new Date().toLocaleString();
            noteToDuplicate.dateCreated = new Date().toISOString();
            savedNotes.push(noteToDuplicate);
            localStorage.setItem("notes", JSON.stringify(savedNotes));
            displaySavedNotes();
            updateStats();
            showMessage('Record duplicated successfully');
        }

        function editNote(index) {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const noteToEdit = savedNotes[index];
            document.getElementById("editNoteIndex").value = index;
            document.getElementById("editMcn").value = noteToEdit.mcn || '';
            document.getElementById("editTransactionId").value = noteToEdit.transactionId || '';
            document.getElementById("editContactName").value = noteToEdit.contactName || '';
            document.getElementById("editEmail").value = noteToEdit.email || '';
            document.getElementById("editCallBackNumber").value = noteToEdit.callBackNumber || '';
            document.getElementById("editPassphraseVerification").value = noteToEdit.passphraseVerification || '';
            document.getElementById("editPassphraseVerified").value = noteToEdit.passphraseVerified || '';
            document.getElementById("editPbx").value = noteToEdit.pbx || '';
            document.getElementById("editSymptom").value = noteToEdit.symptom || '';
            document.getElementById("editIssue").value = noteToEdit.issue || '';
            document.getElementById("editResolution").value = noteToEdit.resolution || '';
            document.getElementById("editTroubleshootingSteps").value = noteToEdit.troubleshootingSteps || '';

            document.getElementById("editNoteModal").style.display = "block";
            document.getElementById("editNoteModal").setAttribute('aria-hidden', 'false');
        }

        document.getElementById("editNoteForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const index = document.getElementById("editNoteIndex").value;
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            savedNotes[index] = {
                ...savedNotes[index],
                mcn: document.getElementById("editMcn").value,
                transactionId: document.getElementById("editTransactionId").value,
                contactName: document.getElementById("editContactName").value,
                email: document.getElementById("editEmail").value,
                callBackNumber: document.getElementById("editCallBackNumber").value,
                passphraseVerification: document.getElementById("editPassphraseVerification").value,
                passphraseVerified: document.getElementById("editPassphraseVerified").value,
                pbx: document.getElementById("editPbx").value,
                symptom: document.getElementById("editSymptom").value,
                issue: document.getElementById("editIssue").value,
                resolution: document.getElementById("editResolution").value,
                troubleshootingSteps: document.getElementById("editTroubleshootingSteps").value,
                timestamp: new Date().toLocaleString()
            };
            localStorage.setItem("notes", JSON.stringify(savedNotes));
            displaySavedNotes();
            updateStats();
            document.getElementById("editNoteModal").style.display = "none";
            document.getElementById("editNoteModal").setAttribute('aria-hidden', 'true');
            showMessage('Record updated successfully');
        });

        document.querySelector(".close").onclick = function() {
            document.getElementById("editNoteModal").style.display = "none";
            document.getElementById("editNoteModal").setAttribute('aria-hidden', 'true');
        }

        window.onclick = function(event) {
            const modal = document.getElementById("editNoteModal");
            if (event.target == modal) {
                modal.style.display = "none";
                modal.setAttribute('aria-hidden', 'true');
            }
        }

        function copyNoteToClipboard(index) {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const note = savedNotes[index];
            const noteText = `MCN or Case ID: ${note.mcn}\nTransaction ID: ${note.transactionId}\nContact Name: ${note.contactName}\nEmail Address: ${note.email}\nCall Back Number: ${note.callBackNumber}\nSecurity Passphrase Verification Needed: ${note.passphraseVerification}\nSecurity Passphrase Verified: ${note.passphraseVerified}\nPBX: ${note.pbx}\nSymptom: ${note.symptom}\nIssue: ${note.issue}\nResolution: ${note.resolution}\nTroubleshooting Steps: ${note.troubleshootingSteps}`;
            copyToClipboard(noteText, 'Record copied to clipboard');
        }

        function resetForm() { document.getElementById("notesForm").reset(); localStorage.removeItem('autoSave_notesForm'); showMessage('Form reset successfully'); }
        function resetT2Form() { document.getElementById("t2Form").reset(); localStorage.removeItem('autoSave_t2Form'); showMessage('Form reset successfully'); }
        function resetOutboundForm() { document.getElementById("outboundForm").reset(); localStorage.removeItem('autoSave_outboundForm'); showMessage('Form reset successfully'); }

        function deleteSelectedNotes() {
            const checkboxes = document.querySelectorAll('.note-checkbox:checked');
            if (checkboxes.length === 0) { showMessage('No records selected', 'error'); return; }
            if (!confirm(`Are you sure you want to delete ${checkboxes.length} selected record(s)?`)) return;
            const indicesToDelete = Array.from(checkboxes).map(checkbox => parseInt(checkbox.dataset.index)).sort((a, b) => b - a);
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            indicesToDelete.forEach(index => { savedNotes.splice(index, 1); });
            localStorage.setItem("notes", JSON.stringify(savedNotes));
            displaySavedNotes();
            updateStats();
            showMessage(`${indicesToDelete.length} record(s) deleted successfully`);
        }

        function showSelectedValue() {
            var dropdown = document.getElementById("myDropdown");
            var resultTextbox = document.getElementById("resultTextbox");
            resultTextbox.value = dropdown.value;
            if (dropdown.value) { showMessage(`Directory contact loaded: ${dropdown.options[dropdown.selectedIndex].text}`); }
        }

        function updateStats() {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            const today = new Date().toDateString();
            const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const todayNotes = savedNotes.filter(note => new Date(note.dateCreated || note.timestamp).toDateString() === today).length;
            const weekNotes = savedNotes.filter(note => new Date(note.dateCreated || note.timestamp) >= weekAgo).length;
            document.getElementById('totalNotesCount').textContent = savedNotes.length;
            document.getElementById('todayNotesCount').textContent = todayNotes;
            document.getElementById('weekNotesCount').textContent = weekNotes;
        }

        function exportNotes() {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            if (savedNotes.length === 0) { showMessage('No records to export', 'error'); return; }
            const dataStr = JSON.stringify(savedNotes, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `workspace-export-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showMessage('Data exported successfully');
        }

        function importNotes() { document.getElementById('importFile').click(); }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    if (!Array.isArray(importedNotes)) throw new Error('Invalid file format');
                    const existingNotes = JSON.parse(localStorage.getItem("notes")) || [];
                    const mergedNotes = [...existingNotes, ...importedNotes];
                    localStorage.setItem("notes", JSON.stringify(mergedNotes));
                    displaySavedNotes();
                    updateStats();
                    showMessage(`${importedNotes.length} records imported successfully`);
                } catch (error) {
                    showMessage('Failed to import data. Invalid format.', 'error');
                }
            };
            reader.readAsText(file);
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 's': e.preventDefault(); if (document.getElementById('notesTab').classList.contains('active')) { copyNote(); } break;
                    case 'r': e.preventDefault(); if (document.getElementById('notesTab').classList.contains('active')) { resetForm(); } break;
                    case 'f': e.preventDefault(); document.getElementById('searchInput').focus(); break;
                }
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
        updateStats();

        if (document.getElementById('savedNotesTab').classList.contains('active')) { displaySavedNotes(); }

        let autoSaveTimeout;
        function setupAutoSave() {
            const inputs = document.querySelectorAll('input:not([type="file"]), textarea, select');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(() => {
                        const form = input.closest('form');
                        if (form) {
                            const formData = new FormData(form);
                            localStorage.setItem('autoSave_' + form.id, JSON.stringify(Object.fromEntries(formData)));
                        }
                    }, 2000);
                });
            });
        }

        function loadAutoSave() {
            const forms = ['notesForm', 'outboundForm', 't2Form'];
            forms.forEach(formId => {
                const savedData = localStorage.getItem('autoSave_' + formId);
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        const form = document.getElementById(formId);
                        for (const key in data) {
                            const input = form.elements[key];
                            if (input && input.type !== 'file') {
                                input.value = data[key];
                            }
                        }
                    } catch (e) { console.error('Failed to parse auto-save data', e); }
                }
            });
        }

        setupAutoSave();
        loadAutoSave();

        function selectAllNotes() {
            const checkboxes = document.querySelectorAll('.note-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(checkbox => { checkbox.checked = !allChecked; });
            const selectedCount = document.querySelectorAll('.note-checkbox:checked').length;
            showMessage(selectedCount > 0 ? `${selectedCount} records selected` : 'All records deselected');
        }

        function deselectAllNotes() {
            document.querySelectorAll('.note-checkbox').forEach(checkbox => { checkbox.checked = false; });
            showMessage('All records deselected');
        }

        function deleteAllNotes() {
            const savedNotes = JSON.parse(localStorage.getItem("notes")) || [];
            if (savedNotes.length === 0) { showMessage('No records to delete', 'error'); return; }
            if (!confirm(`WARNING: This will permanently delete ALL ${savedNotes.length} records!\n\nThis action cannot be undone. Are you absolutely sure?`)) return;
            if (!confirm(`FINAL CONFIRMATION\n\nYou are about to delete ${savedNotes.length} records permanently.\n\nClick OK to proceed with deletion.`)) return;

            const backupData = JSON.stringify(savedNotes, null, 2);
            const backupBlob = new Blob([backupData], {type: 'application/json'});
            const backupUrl = URL.createObjectURL(backupBlob);
            const backupLink = document.createElement('a');
            backupLink.href = backupUrl;
            backupLink.download = `workspace-backup-before-delete-all-${new Date().toISOString().split('T')[0]}.json`;
            backupLink.click();
            URL.revokeObjectURL(backupUrl);

            localStorage.removeItem("notes");
            displaySavedNotes();
            updateStats();
            showMessage(`All ${savedNotes.length} records deleted. Backup file downloaded.`);
            document.getElementById("searchResults").innerHTML = '';
            document.getElementById("searchInput").value = '';
        }
    </script>
